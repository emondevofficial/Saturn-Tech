<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="saturnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="1" />
    </radialGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="200" height="200" rx="40" fill="url(#saturnGrad)" />
  <!-- Planet Body -->
  <circle cx="100" cy="100" r="42" fill="url(#planetGlow)" stroke="#60A5FA" stroke-width="2.5" />
  <!-- Planet Surface Bands -->
  <path d="M60 92 C80 98 120 98 140 92" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.6" fill="none" />
  <path d="M65 106 C85 112 115 112 135 106" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" opacity="0.7" fill="none" />
  <!-- Planetary Orbit Ring Front -->
  <ellipse cx="100" cy="100" rx="82" ry="24" transform="rotate(-26 100 100)" stroke="url(#ringGrad)" stroke-width="6.5" fill="none" />
  <ellipse cx="100" cy="100" rx="72" ry="18" transform="rotate(-26 100 100)" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.7" />
  <!-- Orbit Node Glow -->
  <circle cx="170" cy="68" r="4.5" fill="#38BDF8" />
</svg>
